name: Build Lab Plot Studio

# Every push builds and self-tests Windows and macOS (Apple silicon + Intel) packages, downloadable from the run.
# Pushing a tag such as v0.1.0 also publishes them as a GitHub release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple silicon
            os: macos-14
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'

      - name: Install official macOS Python with Tk
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/python.pkg"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://www.python.org/ftp/python/3.13.16/python-3.13.16-macos11.pkg -o "$pkg"
          echo "30666509020b4da0dd8bc2e773255f34d76b7bb80b66960a928d5f6daa0192d7  $pkg" | shasum -a 256 -c -
          pkgutil --check-signature "$pkg"
          sudo installer -pkg "$pkg" -target /
          bash '/Applications/Python 3.13/Install Certificates.command'
          echo '/Library/Frameworks/Python.framework/Versions/3.13/bin' >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; bin=.build-venv/Scripts; else py=python3; bin=.build-venv/bin; fi
          "$py" -m venv .build-venv
          echo "$GITHUB_WORKSPACE/$bin" >> "$GITHUB_PATH"
          "$bin/python" -m pip install --upgrade pip
          "$bin/python" -m pip install --only-binary=:all: -r requirements-build.txt

      - name: Check architecture
        if: runner.os == 'macOS'
        run: python -c "import platform; assert platform.machine() == '${{ matrix.arch }}', platform.machine()"

      - name: Tests
        run: |
          python tests/test_i18n.py
          python tests/test_phase.py
          python tests/test_gui.py

      - name: Build Windows packages
        if: runner.os == 'Windows'
        run: |
          python packaging/build.py
          python packaging/build.py --onedir

      - name: Build macOS packages
        if: runner.os == 'macOS'
        run: python packaging/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: LabPlotStudio-${{ runner.os }}-${{ matrix.arch || 'x64' }}
          path: |
            release/*
            build/selftest-*.json
          if-no-files-found: error
          compression-level: 0

      - name: Keep build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ runner.os }}-${{ matrix.arch || 'x64' }}
          path: |
            build/pyinstaller/**/warn-*.txt
            build/selftest-*.json
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "import runpy; print(runpy.run_path('labstudio/paths.py')['APP_VERSION'])")"
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match APP_VERSION $version"; exit 1; }
          mapfile -t assets < <(find artifacts -type f \( -name 'LabPlotStudio-*.exe' -o -name 'LabPlotStudio-*.zip' -o -name 'LabPlotStudio-*.dmg' \))
          (cd artifacts && find . -type f \( -name 'LabPlotStudio-*' \) -exec sha256sum {} + | sed 's#\./[^/]*/##') > SHA256SUMS.txt
          gh release create "$TAG" "${assets[@]}" SHA256SUMS.txt --title "Lab Plot Studio $TAG" --notes-file RELEASE_NOTES.md --verify-tag
